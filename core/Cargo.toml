[package]
name = "core"
version = "0.1.0"
edition = "2021"
default-run = "fluffy-core"

[lib]
name = "fluffy_core"
path = "src/lib.rs"

[[bin]]
name = "fluffy-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6.1"
dirs = "5.0"
tokio-tungstenite = "0.21"
futures-util = "0.3"
hostname = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Security", "Win32_System_Registry", "Win32_Foundation", "Win32_System_Power"] }
windows = { version = "0.52", features = [
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
] }
ferrisetw = "1.2"

